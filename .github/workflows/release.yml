name: Release

# Publishes the package to PyPI via Trusted Publishing (OIDC — no stored token).
#
# Triggers:
#   * pushing a version tag like `v0.2.1` (normal path for future releases)
#   * manual "Run workflow" (workflow_dispatch) — use this for the one-time v0.2.1
#     publish: dispatch against `main`, which currently sits on the v0.2.1 commit
#     (pyproject version 0.2.1). Do NOT dispatch against the v0.2.1 *tag* — that tag
#     predates this file, so the workflow doesn't exist there.
#
# One-time setup on pypi.org (Account → Publishing → Add a pending publisher):
#   PyPI Project Name : rate-limit-handoff
#   Owner             : PurpleOrangeAI
#   Repository name   : rate-limit-handoff
#   Workflow name     : release.yml
#   Environment name  : (leave blank)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: python -m pip install build

      - name: Build sdist and wheel
        run: python -m build

      # Safety net: refuse to publish if the git tag doesn't match the package
      # version in pyproject.toml. This is exactly what would have shipped a broken
      # 0.1.0 from a stale checkout.
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "git tag: $TAG   package version: $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package version $PKG — refusing to publish."
            exit 1
          fi

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC Trusted Publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
